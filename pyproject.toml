[project]
name = "leapinput"
version = "0.1.0"
description = "Leap Motion hand tracking to macOS computer-use actions"
requires-python = "==3.12.*"  # pinned by the SDK's bundled _leapc_cffi.cpython-312 module
dependencies = [
    "cffi",
    "pyobjc-framework-Quartz",
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-ApplicationServices",
]

[project.scripts]
leapinput = "leapinput.cli:main"
leapinput-menubar = "leapinput.menubar:main"
leapinput-grab = "leapinput.grab:main"

[project.optional-dependencies]
dev = ["pytest"]
# --source camera: webcam hand tracking, no Leap hardware or SDK required.
# mediapipe 1.x ships only the Tasks API; the model file is fetched separately
# (see leapinput/camera.py MODEL_URL — scripts/setup.sh does it for you).
camera = ["mediapipe"]
# The menu bar on/off switch (rumps 0.4.0, current per PyPI 2026-08-18).
menubar = ["rumps"]
# --source phone: the iPhone camera streamed from Safari over WebRTC — no app
# install on the phone, no virtual camera driver (see leapinput/phonecam.py).
phone = ["aiortc", "aiohttp"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
